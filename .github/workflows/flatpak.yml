name: Build WaxHive Flatpak
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.Morph777.WaxHive.json
          bundle: WaxHive.flatpak
          branch: stable
          build-dir: builddir/flatpak-app
          repo-dir: builddir/flatpak-repo
          artifact-name: WaxHive-x86_64
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WaxHive-x86_64
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WAX_TAG: ${{ github.ref_name }}
        run: gh release create "$WAX_TAG" WaxHive.flatpak --verify-tag --title "WaxHive $WAX_TAG" --generate-notes
