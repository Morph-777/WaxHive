name: Build WaxHive Flatpak
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.Morph777.WaxHive.json
          bundle: WaxHive.flatpak
          branch: stable
          build-dir: builddir/flatpak-app
          repo-dir: builddir/flatpak-repo
          artifact-name: WaxHive-x86_64
      - name: Bundle corresponding sources
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse --bundle-sources \
            --default-branch=stable --repo=builddir/flatpak-repo \
            builddir/flatpak-app io.github.Morph777.WaxHive.json
          flatpak build-bundle --runtime builddir/flatpak-repo WaxHive.Sources.flatpak \
            io.github.Morph777.WaxHive.Sources stable
      - uses: actions/upload-artifact@v4
        with:
          name: WaxHive-sources
          path: WaxHive.Sources.flatpak
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WaxHive-*
          merge-multiple: true
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WAX_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$WAX_TAG" >/dev/null 2>&1; then
            gh release upload "$WAX_TAG" WaxHive.flatpak WaxHive.Sources.flatpak --clobber
          else
            gh release create "$WAX_TAG" WaxHive.flatpak WaxHive.Sources.flatpak --verify-tag --title "WaxHive $WAX_TAG" --generate-notes
          fi
